version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aicrm-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: aicrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicrm-backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/aicrm
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_PRIMARY_MODEL=${GROQ_PRIMARY_MODEL:-llama-3.1-8b-instant}
      - GROQ_CONTEXT_MODEL=${GROQ_CONTEXT_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      - db
    volumes:
      - ./backend:/code

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicrm-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  pgdata:

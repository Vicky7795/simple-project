services:
  # 1. Backend Service (FastAPI running on SQLite)
  - type: web
    name: aicrm-backend
    env: python
    plan: free # Forces Render to use the 100% free web service tier (bypassing credit card requirement)
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend/app && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # Render will securely prompt you to enter your Groq API Key on deploy
      - key: GROQ_PRIMARY_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_CONTEXT_MODEL
        value: llama-3.3-70b-versatile

  # 2. Frontend Service (React Static Site)
  - type: web
    name: aicrm-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        sync: false # Render will prompt you for this value. You can enter your backend URL here.
